name: imaji_install_attribution
description: >-
  Flutter plugin: Play Install Referrer (Android) and Apple AdServices (iOS)
  for install attribution and deferred deep links, with typed results and
  first-launch-only reads.
version: 0.2.1
repository: https://github.com/saimskywalker/flutter-imaji-install-attribution
issue_tracker: https://github.com/saimskywalker/flutter-imaji-install-attribution/issues
topics:
  - flutter
  - android
  - ios
  - deep-linking
  - attribution

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.github.saimskywalker.imaji_install_attribution
        pluginClass: ImajiInstallAttributionPlugin
      ios:
        pluginClass: ImajiInstallAttributionPlugin
