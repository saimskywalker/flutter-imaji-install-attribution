# 3 GB is plenty for this example and keeps the build usable on 8 GB machines.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.newDsl=false
# AGP Built-in Kotlin: neither this app nor the plugin applies the Kotlin
# Gradle Plugin. Requires AGP 9+ and Flutter 3.47+.
android.builtInKotlin=true
