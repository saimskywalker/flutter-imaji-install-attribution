name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  JAVA_VERSION: "17"

jobs:
  dart:
    name: Dart (format, analyze, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Example widget test
        working-directory: example
        run: flutter test
      - name: Package description is 60-180 characters
        run: |
          python3 - pubspec.yaml <<'PY'
          import sys
          lines = open(sys.argv[1]).read().splitlines()
          i = next(n for n, l in enumerate(lines) if l.startswith("description:"))
          head = lines[i].split(":", 1)[1].strip()
          if head in (">-", ">", "|-", "|"):
              parts = []
              for l in lines[i + 1:]:
                  if l.strip() and not l.startswith(" "):
                      break
                  parts.append(l.strip())
              desc = " ".join(p for p in parts if p)
          else:
              desc = head.strip("\"'")
          n = len(desc)
          print(f"{sys.argv[1]}: description is {n} characters")
          if not 60 <= n <= 180:
              print(f"::error::pubspec description must be 60-180 characters for pub.dev, got {n}")
              sys.exit(1)
          PY
      - name: Publish dry run
        run: dart pub publish --dry-run
      - name: No Kotlin Gradle Plugin in the plugin build file
        run: |
          # Comments are ignored; any code line naming KGP fails the build.
          if grep -vE '^\s*//' android/build.gradle.kts | grep -nE "kotlin-android|org\.jetbrains\.kotlin\.android|kotlin-gradle-plugin|kotlinOptions"; then
            echo "::error::android/build.gradle.kts must not reference the Kotlin Gradle Plugin"
            exit 1
          fi

  referrer_builder:
    # Plain Dart SDK, no Flutter: proves a backend can depend on the builder.
    name: imaji_referrer_builder (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.8.0", stable] # the pubspec's lower bound, and the latest
    defaults:
      run:
        working-directory: packages/imaji_referrer_builder
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - name: No runtime dependencies
        run: |
          # `dart pub deps --no-dev` lists the SDK, then the package; any
          # further line is a runtime dependency.
          deps=$(dart pub deps --no-dev --style=list | grep -vE '^(Dart SDK|Flutter SDK|imaji_referrer_builder) |^ *$' || true)
          if [ -n "$deps" ]; then
            echo "::error::imaji_referrer_builder must have no runtime dependencies"
            echo "$deps"
            exit 1
          fi
      - name: Format
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test (including the shared vectors)
        run: dart test
      - name: Example runs
        run: dart run example/imaji_referrer_builder_example.dart
      - name: Package description is 60-180 characters
        run: |
          python3 - pubspec.yaml <<'PY'
          import sys
          lines = open(sys.argv[1]).read().splitlines()
          i = next(n for n, l in enumerate(lines) if l.startswith("description:"))
          head = lines[i].split(":", 1)[1].strip()
          if head in (">-", ">", "|-", "|"):
              parts = []
              for l in lines[i + 1:]:
                  if l.strip() and not l.startswith(" "):
                      break
                  parts.append(l.strip())
              desc = " ".join(p for p in parts if p)
          else:
              desc = head.strip("\"'")
          n = len(desc)
          print(f"{sys.argv[1]}: description is {n} characters")
          if not 60 <= n <= 180:
              print(f"::error::pubspec description must be 60-180 characters for pub.dev, got {n}")
              sys.exit(1)
          PY
      - name: Publish dry run
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run

  android:
    name: Android (example build, Kotlin unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build example APK (android.builtInKotlin=true)
        working-directory: example
        shell: bash # -eo pipefail, so a failed build is not hidden by tee
        run: flutter build apk --debug 2>&1 | tee build.log
      - name: Kotlin unit tests
        working-directory: example/android
        shell: bash
        run: ./gradlew :imaji_install_attribution:testDebugUnitTest --console=plain 2>&1 | tee gradle.log
      - name: Flutter does not name this plugin as applying KGP
        # The warning is printed by Flutter's Gradle plugin; plain Gradle
        # output shows it reliably, while `flutter build` may filter it.
        run: |
          if grep -n "apply Kotlin Gradle Plugin" example/build.log example/android/gradle.log; then
            echo "::error::Flutter reported a plugin applying the Kotlin Gradle Plugin"
            exit 1
          fi

  ios:
    name: iOS (example build)
    # macOS minutes are free only for public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Xcode resolves the plugin's Swift package through its real path,
          # whose identity is the directory name: it must match the package.
          path: imaji_install_attribution
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build example for the simulator
        working-directory: imaji_install_attribution/example
        run: flutter build ios --simulator --debug --no-codesign
