name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  JAVA_VERSION: "17"

jobs:
  dart:
    name: Dart (format, analyze, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/imaji_install_attribution
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Example widget test
        working-directory: packages/imaji_install_attribution/example
        run: flutter test
      - name: Package description is 60-180 characters
        run: |
          python3 - pubspec.yaml <<'PY'
          import sys
          lines = open(sys.argv[1]).read().splitlines()
          i = next(n for n, l in enumerate(lines) if l.startswith("description:"))
          head = lines[i].split(":", 1)[1].strip()
          if head in (">-", ">", "|-", "|"):
              parts = []
              for l in lines[i + 1:]:
                  if l.strip() and not l.startswith(" "):
                      break
                  parts.append(l.strip())
              desc = " ".join(p for p in parts if p)
          else:
              desc = head.strip("\"'")
          n = len(desc)
          print(f"{sys.argv[1]}: description is {n} characters")
          if not 60 <= n <= 180:
              print(f"::error::pubspec description must be 60-180 characters for pub.dev, got {n}")
              sys.exit(1)
          PY
      - name: Publish dry run
        shell: bash # -eo pipefail, so a failed dry run is not hidden by tee
        run: dart pub publish --dry-run 2>&1 | tee "$RUNNER_TEMP/publish.log"
      - name: Archive holds only this package
        run: |
          # The plugin's archive must not pick up the sibling packages.
          if grep -n "── packages$" "$RUNNER_TEMP/publish.log"; then
            echo "::error::the pub archive must not contain packages/"
            exit 1
          fi
      - name: No Kotlin Gradle Plugin in the plugin build file
        run: |
          # Comments are ignored; any code line naming KGP fails the build.
          if grep -vE '^\s*//' android/build.gradle.kts | grep -nE "kotlin-android|org\.jetbrains\.kotlin\.android|kotlin-gradle-plugin|kotlinOptions"; then
            echo "::error::android/build.gradle.kts must not reference the Kotlin Gradle Plugin"
            exit 1
          fi

  referrer_builder:
    # Plain Dart SDK, no Flutter: proves a backend can depend on the builder.
    name: imaji_referrer_builder (Dart ${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.8.0", stable] # the pubspec's lower bound, and the latest
    defaults:
      run:
        working-directory: packages/imaji_referrer_builder
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - name: No runtime dependencies
        run: |
          # `dart pub deps --no-dev` lists the SDK, then the package; any
          # further line is a runtime dependency.
          deps=$(dart pub deps --no-dev --style=list | grep -vE '^(Dart SDK|Flutter SDK|imaji_referrer_builder) |^ *$' || true)
          if [ -n "$deps" ]; then
            echo "::error::imaji_referrer_builder must have no runtime dependencies"
            echo "$deps"
            exit 1
          fi
      - name: Format
        if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test (including the shared vectors)
        run: dart test
      - name: Example runs
        run: dart run example/imaji_referrer_builder_example.dart
      - name: Package description is 60-180 characters
        run: |
          python3 - pubspec.yaml <<'PY'
          import sys
          lines = open(sys.argv[1]).read().splitlines()
          i = next(n for n, l in enumerate(lines) if l.startswith("description:"))
          head = lines[i].split(":", 1)[1].strip()
          if head in (">-", ">", "|-", "|"):
              parts = []
              for l in lines[i + 1:]:
                  if l.strip() and not l.startswith(" "):
                      break
                  parts.append(l.strip())
              desc = " ".join(p for p in parts if p)
          else:
              desc = head.strip("\"'")
          n = len(desc)
          print(f"{sys.argv[1]}: description is {n} characters")
          if not 60 <= n <= 180:
              print(f"::error::pubspec description must be 60-180 characters for pub.dev, got {n}")
              sys.exit(1)
          PY
      - name: Publish dry run
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run

  android:
    name: Android (example build, Kotlin unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/imaji_install_attribution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build example APK (android.builtInKotlin=true)
        working-directory: packages/imaji_install_attribution/example
        shell: bash # -eo pipefail, so a failed build is not hidden by tee
        run: flutter build apk --debug 2>&1 | tee build.log
      - name: Kotlin unit tests
        working-directory: packages/imaji_install_attribution/example/android
        shell: bash
        run: ./gradlew :imaji_install_attribution:testDebugUnitTest --console=plain 2>&1 | tee gradle.log
      - name: Flutter does not name this plugin as applying KGP
        # The warning is printed by Flutter's Gradle plugin; plain Gradle
        # output shows it reliably, while `flutter build` may filter it.
        run: |
          if grep -n "apply Kotlin Gradle Plugin" example/build.log example/android/gradle.log; then
            echo "::error::Flutter reported a plugin applying the Kotlin Gradle Plugin"
            exit 1
          fi

  android_release:
    # What Play receives: a release bundle shrunk by R8 (full mode), signed
    # with the debug key. Scripts in .github/scripts run the same checks
    # locally after a release build.
    name: Android release (R8 bundle, manifest, smoke test)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: packages/imaji_install_attribution/example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release app bundle
        run: flutter build appbundle --release
      - name: R8 shrank the release build
        run: test -s build/app/outputs/mapping/release/mapping.txt
      - name: Merged-manifest contributions match the snapshot
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/merged_manifest_snapshot.py"
      - name: Native libraries are 16 KB aligned
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/check_native_libs.py" build/app/outputs/bundle/release/app-release.aab
      - name: Build release APK
        # Same R8 output as the bundle; an APK can be installed with adb.
        run: flutter build apk --release
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Release build reads a typed result on an emulator
        # A Play Store image, so read() goes through the Install Referrer
        # service's Binder interface after R8.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: .github/scripts/android_release_smoke.sh packages/imaji_install_attribution/example/build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS (example build)
    # macOS minutes are free only for public repositories.
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build example for the simulator
        working-directory: packages/imaji_install_attribution/example
        run: flutter build ios --simulator --debug --no-codesign

  ios_release:
    name: iOS release (${{ matrix.dependency_manager }})
    if: ${{ !github.event.repository.private }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dependency_manager: [SwiftPM, CocoaPods]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build the example for devices
        if: matrix.dependency_manager == 'SwiftPM'
        working-directory: packages/imaji_install_attribution/example
        run: |
          flutter build ios --release --no-codesign
          echo "APP=$PWD/build/ios/iphoneos/Runner.app" >> "$GITHUB_ENV"
      - name: Build a CocoaPods app that uses the plugin, for devices
        # A new app rather than the example: the example's Xcode project
        # references the plugin's Swift package, which needs SwiftPM.
        if: matrix.dependency_manager == 'CocoaPods'
        run: |
          flutter config --no-enable-swift-package-manager
          host="$RUNNER_TEMP/pods_host"
          flutter create --platforms=ios --org com.example --project-name pods_host "$host"
          cp packages/imaji_install_attribution/example/lib/main.dart "$host/lib/main.dart"
          cd "$host"
          flutter pub add imaji_install_attribution --path "$GITHUB_WORKSPACE/packages/imaji_install_attribution"
          flutter build ios --release --no-codesign
          if ! grep -q '^  - imaji_install_attribution ' ios/Podfile.lock; then
            echo "::error::the plugin was not installed through CocoaPods"
            exit 1
          fi
          echo "APP=$host/build/ios/iphoneos/Runner.app" >> "$GITHUB_ENV"
      - name: Privacy manifest is in the app bundle
        run: .github/scripts/check_ios_privacy_manifest.sh "$APP"
